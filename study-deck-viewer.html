<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Study Deck Flashcards</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEDE4;
    --paper-raise:#F7F6F0;
    --ink:#21261F;
    --ink-soft:#52584C;
    --ink-faint:#8B9182;
    --teal:#2F5D50;
    --teal-deep:#1F3F37;
    --teal-pale:#E1EAE6;
    --white:#FFFFFF;
    --line:#D9D6C9;
    --danger:#A23E3E;
    --danger-pale:#F3E1DF;
    --radius:14px;
    --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --shadow-card: 0 1px 2px rgba(33,38,31,0.06), 0 1px 1px rgba(33,38,31,0.04);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;touch-action:manipulation;}

  .app-shell{max-width:820px;margin:0 auto;padding:0 20px 60px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 18px;
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .brand-mark{
    font-family:var(--serif);font-weight:600;font-size:22px;
    color:var(--ink);letter-spacing:-0.01em;
  }

  .btn{
    border:none;border-radius:10px;padding:12px 20px;
    font-size:15px;font-weight:500;cursor:pointer;min-height:44px;
    transition:transform 0.12s ease, background 0.15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-raise);}
  .btn-text{background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;padding:6px 8px;}
  .btn-text:hover{color:var(--ink);}

  /* ---------- Message screen (loading / empty / error) ---------- */
  .message{padding:48px 0 20px;}
  .message h1{
    font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.25;
    margin:0 0 12px;max-width:480px;
  }
  .message p{color:var(--ink-soft);font-size:16px;line-height:1.6;max-width:460px;margin:0;}

  /* ---------- Deck header ---------- */
  .deck-header{padding:12px 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .deck-kicker{
    margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--teal);
  }
  #deckTitle{
    font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.25;margin:0 0 6px;
  }
  .deck-meta{color:var(--ink-soft);font-size:14px;margin:0;}

  /* ---------- Flashcards ---------- */
  .flash-toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:8px;font-size:14px;color:var(--ink-soft);
  }
  .flash-progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:26px;}
  .flash-progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width 0.3s ease;}

  .flashcard-stage{perspective:1400px;padding:8px 0 22px;}
  .flashcard{position:relative;width:100%;max-width:520px;height:300px;margin:0 auto;cursor:pointer;}
  .flashcard-inner{
    position:relative;width:100%;height:100%;
    transition:transform 0.5s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flashcard-face{
    position:absolute;inset:0;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    border-radius:16px;padding:30px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    box-shadow:var(--shadow-card);
  }
  .flashcard-front{background:var(--white);border:1px solid var(--line);}
  .flashcard-back{background:var(--teal);color:#fff;transform:rotateY(180deg);}
  .flashcard-face p{
    font-family:var(--serif);font-size:19px;line-height:1.5;font-weight:500;
    max-height:100%;overflow-y:auto;margin:0;
  }
  .flashcard-face .hint{
    position:absolute;bottom:14px;left:0;right:0;
    text-align:center;font-family:var(--sans);font-size:12px;
    color:var(--ink-faint);font-weight:400;
  }
  .flashcard-back .hint{color:rgba(255,255,255,0.65);}

  .flash-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:10px;}
  .flash-nav-btn{
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--line);background:var(--white);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .flash-nav-btn svg{width:18px;height:18px;stroke:var(--ink-soft);}
  .flash-nav-btn:active{background:var(--paper-raise);}

  .flash-mark-row{display:flex;gap:12px;justify-content:center;margin-top:22px;}
  .flash-mark-row .btn{min-width:150px;}
  .mark-again{background:var(--white);color:var(--danger);border:1px solid var(--danger-pale);}
  .mark-good{background:var(--white);color:var(--teal-deep);border:1px solid var(--teal-pale);}

  .flash-summary{text-align:center;padding:40px 20px;}
  .flash-summary h3{font-family:var(--serif);font-size:22px;margin:0 0 8px;}
  .flash-summary p{color:var(--ink-soft);margin:0 0 24px;}
  .flash-summary .stats{display:flex;gap:16px;justify-content:center;margin-bottom:28px;}
  .stat-pill{padding:10px 18px;border-radius:10px;font-size:14px;}
  .stat-good{background:var(--teal-pale);color:var(--teal-deep);}
  .stat-again{background:var(--danger-pale);color:var(--danger);}
  .flash-summary .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  @media (prefers-reduced-motion: reduce){
    .flashcard-inner{transition:none;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <span class="brand-mark">Study Deck</span>
  </header>

  <main>
    <section id="messageScreen" class="message">
      <h1 id="messageTitle">Opening your flashcards…</h1>
      <p id="messageBody"></p>
    </section>

    <section id="studyScreen" hidden>
      <div class="deck-header">
        <p class="deck-kicker">Shared flashcards</p>
        <h1 id="deckTitle"></h1>
        <p id="deckMeta" class="deck-meta"></p>
      </div>
      <div id="flashPanel"></div>
    </section>
  </main>
</div>

<script>
(function(){
  'use strict';

  // This page only reads share links made by Study Deck. It has no API key, no uploads,
  // no storage, and makes no network requests: the cards come entirely from the link's
  // #share=<version>.<z|r>.<data> part, which never leaves this device.
  var SUPPORTED_VERSION = 1;
  var LINK_PARAM = 'share=';
  var MAX_LINK_BYTES = 2000000;
  var MAX_CARDS = 500;

  var el = {
    messageScreen: document.getElementById('messageScreen'),
    messageTitle: document.getElementById('messageTitle'),
    messageBody: document.getElementById('messageBody'),
    studyScreen: document.getElementById('studyScreen'),
    deckTitle: document.getElementById('deckTitle'),
    deckMeta: document.getElementById('deckMeta'),
    flashPanel: document.getElementById('flashPanel')
  };

  var cards = [];
  var state = null;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---------- Decoding (same format the main app writes) ----------
  function b64urlToBytes(str){
    var b = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function runStream(bytes, transform, maxBytes){
    var writer = transform.writable.getWriter();
    writer.write(bytes)['catch'](function(){});
    writer.close()['catch'](function(){});
    var reader = transform.readable.getReader();
    var chunks = [], total = 0;
    function pump(){
      return reader.read().then(function(r){
        if (r.done){
          var out = new Uint8Array(total), off = 0;
          chunks.forEach(function(c){ out.set(c, off); off += c.length; });
          return out;
        }
        total += r.value.length;
        if (maxBytes && total > maxBytes){ reader.cancel(); throw new Error('LINK_BAD'); }
        chunks.push(r.value);
        return pump();
      });
    }
    return pump();
  }

  function decodeSharePayload(param){
    var parts = String(param).split('.');
    if (parts.length !== 3) return Promise.reject(new Error('LINK_BAD'));
    var ver = parseInt(parts[0], 10);
    if (!(ver >= 1)) return Promise.reject(new Error('LINK_BAD'));
    if (ver > SUPPORTED_VERSION) return Promise.reject(new Error('LINK_TOO_NEW'));
    var bytes;
    try { bytes = b64urlToBytes(parts[2]); } catch(e){ return Promise.reject(new Error('LINK_BAD')); }
    var bytesPromise;
    if (parts[1] === 'z'){
      if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('LINK_NO_SUPPORT'));
      bytesPromise = runStream(bytes, new DecompressionStream('deflate-raw'), MAX_LINK_BYTES);
    } else if (parts[1] === 'r'){
      bytesPromise = Promise.resolve(bytes);
    } else {
      return Promise.reject(new Error('LINK_BAD'));
    }
    return bytesPromise.then(function(out){
      var data = JSON.parse(new TextDecoder().decode(out));
      var rows = Array.isArray(data.c) ? data.c : [];
      var clean = rows.filter(function(r){
        return Array.isArray(r) && typeof r[0] === 'string' && typeof r[1] === 'string' && r[0].trim() && r[1].trim();
      }).slice(0, MAX_CARDS).map(function(r){
        return { front: r[0].trim(), back: r[1].trim() };
      });
      if (!clean.length) throw new Error('LINK_NO_CARDS');
      var title = (typeof data.t === 'string' && data.t.trim()) ? data.t.trim().slice(0, 200) : 'Flashcards';
      return { title: title, cards: clean };
    })['catch'](function(err){
      if (err && err.message && err.message.indexOf('LINK_') === 0) throw err;
      throw new Error('LINK_BAD');
    });
  }

  // ---------- Screens ----------
  function showMessage(title, body){
    el.studyScreen.hidden = true;
    el.messageScreen.hidden = false;
    el.messageTitle.textContent = title;
    el.messageBody.textContent = body || '';
  }

  function showDeck(deck){
    cards = deck.cards;
    el.messageScreen.hidden = true;
    el.studyScreen.hidden = false;
    el.deckTitle.textContent = deck.title;
    el.deckMeta.textContent = cards.length + (cards.length === 1 ? ' card' : ' cards');
    document.title = deck.title + ' \u00B7 Flashcards';
    initState();
    render();
  }

  function init(){
    var prefix = '#' + LINK_PARAM;
    var h = location.hash || '';
    if (h.indexOf(prefix) !== 0){
      showMessage('No flashcards here yet', 'Open the flashcard link you were sent, and your deck will appear here.');
      return;
    }
    showMessage('Opening your flashcards\u2026', '');
    decodeSharePayload(h.slice(prefix.length)).then(showDeck)['catch'](function(err){
      console.error(err);
      var m = err && err.message;
      if (m === 'LINK_TOO_NEW') showMessage('This link needs a newer version', 'Reload this page and open the link again. If that doesn\u2019t help, ask for a fresh link.');
      else if (m === 'LINK_NO_SUPPORT') showMessage('This browser can\u2019t open the link', 'Try opening it in an up-to-date Safari or Chrome, or ask for the flashcards as a file instead.');
      else if (m === 'LINK_NO_CARDS') showMessage('No flashcards found', 'That link didn\u2019t contain any usable cards. Ask for it to be sent again.');
      else showMessage('That link looks incomplete', 'Part of it may have been cut off when it was sent. Ask for it to be sent again.');
    });
  }

  window.addEventListener('hashchange', init);

  // ---------- Study ----------
  function initState(){
    state = {
      order: cards.map(function(_, i){ return i; }),
      pos: 0,
      flipped: false,
      marks: {}
    };
  }

  function render(){
    var order = state.order;

    if (state.pos >= order.length){
      var goodCount = 0, againIdx = [];
      Object.keys(state.marks).forEach(function(k){
        if (state.marks[k] === 'good') goodCount++;
        else if (state.marks[k] === 'again') againIdx.push(Number(k));
      });
      var sum = '<div class="flash-summary"><h3>Deck complete</h3>' +
        '<p>You went through ' + order.length + ' card' + (order.length === 1 ? '' : 's') + '.</p>' +
        '<div class="stats">' +
        '<span class="stat-pill stat-good">' + goodCount + ' solid</span>' +
        '<span class="stat-pill stat-again">' + againIdx.length + ' to review</span>' +
        '</div><div class="actions">';
      if (againIdx.length){
        sum += '<button id="reviewAgainBtn" class="btn btn-primary">Review the ' + againIdx.length + ' again</button>';
      }
      sum += '<button id="restartBtn" class="btn btn-ghost">Restart full deck</button></div></div>';
      el.flashPanel.innerHTML = sum;
      var ra = document.getElementById('reviewAgainBtn');
      if (ra) ra.addEventListener('click', function(){
        state.order = againIdx;
        state.pos = 0; state.flipped = false; state.marks = {};
        render();
      });
      document.getElementById('restartBtn').addEventListener('click', function(){
        initState(); render();
      });
      return;
    }

    var cardIdx = order[state.pos];
    var card = cards[cardIdx];
    var pct = Math.round((state.pos / order.length) * 100);

    el.flashPanel.innerHTML =
      '<div class="flash-toolbar"><span>Card ' + (state.pos + 1) + ' of ' + order.length + '</span>' +
      '<button id="shuffleBtn" class="btn-text">Shuffle</button></div>' +
      '<div class="flash-progress-track"><div class="flash-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="flashcard-stage"><div class="flashcard" id="flashcardEl"><div class="flashcard-inner">' +
      '<div class="flashcard-face flashcard-front"><p>' + escapeHtml(card.front) + '</p><span class="hint">Tap to flip</span></div>' +
      '<div class="flashcard-face flashcard-back"><p>' + escapeHtml(card.back) + '</p><span class="hint">Tap to flip back</span></div>' +
      '</div></div></div>' +
      '<div class="flash-nav">' +
      '<button class="flash-nav-btn" id="prevBtn" aria-label="Previous card"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
      '<button class="flash-nav-btn" id="nextBtn" aria-label="Next card"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>' +
      '</div>' +
      '<div class="flash-mark-row" id="markRow" hidden>' +
      '<button class="btn mark-again" id="markAgainBtn">Still learning</button>' +
      '<button class="btn mark-good" id="markGoodBtn">Got it</button>' +
      '</div>';

    var cardEl = document.getElementById('flashcardEl');
    var markRow = document.getElementById('markRow');

    // Flip by toggling a class (not re-rendering) so the 3D flip animates.
    function setFlipped(f){
      state.flipped = f;
      cardEl.classList.toggle('flipped', f);
      markRow.hidden = !f;
    }
    cardEl.addEventListener('click', function(){ setFlipped(!state.flipped); });

    function go(delta){
      var next = state.pos + delta;
      if (next < 0 || next > order.length - 1) return;
      state.pos = next; state.flipped = false; render();
    }
    document.getElementById('prevBtn').addEventListener('click', function(){ go(-1); });
    document.getElementById('nextBtn').addEventListener('click', function(){ go(1); });

    document.getElementById('shuffleBtn').addEventListener('click', function(){
      var arr = order.slice();
      for (var i = arr.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      state.order = arr; state.pos = 0; state.flipped = false;
      render();
    });

    function mark(type){
      state.marks[cardIdx] = type;
      state.pos++; state.flipped = false;
      render();
    }
    document.getElementById('markAgainBtn').addEventListener('click', function(){ mark('again'); });
    document.getElementById('markGoodBtn').addEventListener('click', function(){ mark('good'); });

    // swipe support
    var sx = null, sy = null;
    cardEl.addEventListener('touchstart', function(e){
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    cardEl.addEventListener('touchend', function(e){
      if (sx === null) return;
      var dx = e.changedTouches[0].clientX - sx;
      var dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
      sx = null; sy = null;
    });
  }

  document.addEventListener('keydown', function(e){
    if (!state || el.studyScreen.hidden) return;
    if (e.key === 'ArrowRight'){
      var n = document.getElementById('nextBtn'); if (n) n.click();
    } else if (e.key === 'ArrowLeft'){
      var p = document.getElementById('prevBtn'); if (p) p.click();
    } else if (e.key === ' ' || e.key === 'Enter'){
      var t = document.activeElement && document.activeElement.tagName;
      if (t === 'BUTTON') return; // let a focused button handle its own key press
      var c = document.getElementById('flashcardEl');
      if (c){ e.preventDefault(); c.click(); }
    }
  });

  init();
})();
</script>
</body>
</html>
